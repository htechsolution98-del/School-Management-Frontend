<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="bgBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Sky Blue Studio Photo Background -->
  <rect width="120" height="140" fill="url(#bgBlue)" />

  <!-- Body / Shoulders (White School Uniform Shirt) -->
  <path d="M 12 140 C 12 112, 35 102, 60 102 C 85 102, 108 112, 108 140 Z" fill="#ffffff" />

  <!-- Uniform Collar -->
