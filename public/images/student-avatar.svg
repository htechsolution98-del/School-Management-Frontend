  <!-- Dark Blue School Necktie -->
  <path d="M 57 114 L 63 114 L 65 140 L 55 140 Z" fill="#1e3a8a" />
  <polygon points="56,112 64,112 62,118 58,118" fill="#172554" />

  <!-- Neck -->
  <path d="M 52 86 L 68 86 L 68 102 L 52 102 Z" fill="#fcd34d" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="65" rx="22" ry="26" fill="#fde68a" />

  <!-- Ears -->
  <ellipse cx="37" cy="66" rx="4" ry="7" fill="#fde68a" />
  <ellipse cx="83" cy="66" rx="4" ry="7" fill="#fde68a" />

  <!-- Neat Student Haircut -->
  <path d="M 37 60 C 37 42, 45 35, 60 35 C 75 35, 83 42, 83 60 C 81 48, 74 44, 60 45 C 46 46, 39 52, 37 60 Z" fill="#1e293b" />
  <path d="M 38 52 C 45 38, 75 38, 82 52 C 78 44, 70 42, 60 43 C 50 44, 42 46, 38 52 Z" fill="#0f172a" />

  <!-- Eyes & Eyebrows -->
