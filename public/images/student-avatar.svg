  <ellipse cx="69" cy="64" rx="2.2" ry="2.5" fill="#1e293b" />
  <path d="M 47 59 Q 51 57 55 59" stroke="#1e293b" stroke-width="1.4" fill="none" stroke-linecap="round" />
  <path d="M 65 59 Q 69 57 73 59" stroke="#1e293b" stroke-width="1.4" fill="none" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 60 64 L 60 70 L 63 71" stroke="#d97706" stroke-width="1.2" fill="none" stroke-linecap="round" />

  <!-- Cheerful Smile -->
  <path d="M 52 75 Q 60 81 68 75" stroke="#b45309" stroke-width="1.5" fill="none" stroke-linecap="round" />
</svg>
